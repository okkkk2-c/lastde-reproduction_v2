run_name: proxy_opt-2.7_gpt2_xsum_150
seed: 0
cache_dir: cache
n_boot: 1000

data:
  - name: xsum
    path: data/pairs/xsum/gpt2.jsonl
    limit: 150

models:
  - name: gpt2_proxy_opt-2.7
    source: gpt2
    proxy: facebook/opt-2.7b
    white_box: false

methods:
  - lastde
  - likelihood
  - logrank
  - entropy
  - detectlrr

lastde:
  s: 3
  eps_factor: 10
  tau_prime: 5
  agg: std
