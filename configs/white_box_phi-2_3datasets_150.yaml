run_name: white_box_phi-2_3datasets_150
seed: 0
cache_dir: cache
n_boot: 1000

data:
  - name: xsum
    path: data/pairs/xsum/root__autodl-tmp__models__phi-2.jsonl
    limit: 150
  - name: squad
    path: data/pairs/squad/root__autodl-tmp__models__phi-2.jsonl
    limit: 150
  - name: writingprompts
    path: data/pairs/writingprompts/root__autodl-tmp__models__phi-2.jsonl
    limit: 150

models:
  - name: phi-2_white
    source: /root/autodl-tmp/models/phi-2
    proxy: /root/autodl-tmp/models/phi-2
    white_box: true

methods:
  - lastde
  - likelihood
  - logrank
  - entropy
  - detectlrr

lastde:
  s: 3
  eps_factor: 10
  tau_prime: 5
  agg: std
