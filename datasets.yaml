# Lastde full reproduction: dataset registry.
# Each dataset contributes 150 human examples; first 30 tokens are the prompt.
# LLM continuations are generated by the source model from that prompt.

xsum:
  repo: EdinburghNLP/xsum
  split: test
  field: document
  language: en
  domain: BBC news
  used_in: [white_box_main, black_box_main]
  status: ready

squad:
  repo: rajpurkar/squad
  config: plain_text
  split: train
  field: context
  language: en
  domain: Wikipedia QA
  used_in: [white_box_main]
  status: ready

writingprompts:
  repo: euclaise/writingprompts
  split: train
  field: story
  language: en
  domain: story generation
  used_in: [white_box_main, black_box_main]
  status: ready

reddit:
  repo: defunct-datasets/eli5
  split: train_eli5
  field: answers
  language: en
  domain: Reddit ELI5
  used_in: [black_box_main]
  status: needs_loader_fix
  note: original ELI5 loader may need trust_remote_code / a parquet mirror

wmt16_de:
  repo: wmt/wmt16
  config: de-en
  split: train
  field: translation
  lang: de
  concat: true
  language: de
  used_in: [cross_lingual]
  status: ready

wmt16_en:
  repo: wmt/wmt16
  config: de-en
  split: train
  field: translation
  lang: en
  concat: true
  language: en
  used_in: [cross_lingual]
  status: ready

zhihu:
  local_path: data/human/zhihu.jsonl
  language: zh
  used_in: [cross_lingual]
  status: not_public
  note: user must supply the Chinese JSONL; no public download
